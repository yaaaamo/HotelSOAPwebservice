<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Search Results</title>
</head>
<body>

<h1>Search Results</h1>

<div th:if="${error}">
    <p th:text="${error}" style="color:red"></p>
</div>

<div th:if="${message}">
    <p th:text="${message}" style="color:orange"></p>
</div>

<!-- Search form again -->
<form action="/search" method="get">
    <label>City: <input type="text" name="city" th:value="${city}"></label><br>
    <label>Start: <input type="date" name="startDate" th:value="${startDate}"></label><br>
    <label>End: <input type="date" name="endDate" th:value="${endDate}"></label><br>
    <label>Persons: <input type="number" name="persons" th:value="${persons}"></label><br>
    <label>Min Price: <input type="number" name="minPrice" th:value="${minPrice}"></label><br>
    <label>Max Price: <input type="number" name="maxPrice" th:value="${maxPrice}"></label><br>
    <label>Stars: <input type="number" name="stars" th:value="${stars}"></label><br>

    <button type="submit">Search</button>
</form>

<hr>

<div th:if="${hasResults}">
    <h2 th:text="'Offers found: ' + ${#lists.size(offers)}"></h2>

    <div th:each="offer : ${offers}">
        <p>
            Offer ID: <span th:text="${offer.offerId}"></span><br>
            Price: <span th:text="${offer.price}"></span><br>
            Start Date: <span th:text="${offer.startDate}"></span><br>
            End Date: <span th:text="${offer.endDate}"></span><br>
            Room: <span th:text="${offer.roomType}"></span><br>

            <a th:href="@{/reserve(offerId=${offer.offerId})}">Reserve</a>
        </p>

        <hr>
    </div>
</div>

</body>
</html>
