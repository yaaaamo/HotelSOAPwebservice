spring.application.name=agency-client
server.port=9090
agency.id=AGENCY1
agency.login=agency1
agency.password=pass123


# Agency Configuration


# Database Configuration (if using H2)
spring.datasource.url=jdbc:h2:mem:agencydb
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update

# ========================================
# DYNAMIC HOTEL PARTNERS CONFIGURATION
# ========================================
# IMPORTANT: Make sure you have generated SOAP client stubs first!
# For each hotel, run:
#   wsimport -keep -p com.example.HotelTP.agency.clients.h1 http://localhost:8080/hotelservice?wsdl
#   wsimport -keep -p com.example.HotelTP.agency.clients.h2 http://localhost:8083/hotelservice?wsdl

# Hotel 1 (H1)
hotels.partners[0].id=H1
hotels.partners[0].name=Grand Occitanie
hotels.partners[0].wsdl-url=http://localhost:8080/hotelservice?wsdl
# Explicit service interface (recommended for clarity)
hotels.partners[0].service-interface=com.example.HotelTP.agency.clients.h1.HotelService
hotels.partners[0].namespace=http://service.server.HotelSOAP.example.com/
hotels.partners[0].service-name=HotelServiceImplService
hotels.partners[0].port-name=HotelServiceImplPort
hotels.partners[0].enabled=true

# Hotel 2 (H2)
hotels.partners[1].id=H2
hotels.partners[1].name=Hotel Paris Centre
hotels.partners[1].wsdl-url=http://localhost:8083/hotelservice?wsdl
# Explicit service interface (recommended for clarity)
hotels.partners[1].service-interface=com.example.HotelTP.agency.clients.h2.HotelService
hotels.partners[1].namespace=http://service.server.HotelSOAP.example.com/
hotels.partners[1].service-name=HotelServiceImplService
hotels.partners[1].port-name=HotelServiceImplPort
hotels.partners[1].enabled=true


# Logging
logging.level.com.example.HotelTP=DEBUG
