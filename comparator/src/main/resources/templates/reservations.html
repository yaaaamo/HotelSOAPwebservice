<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Toutes les réservations</title>
    <style>
        :root {
            --bg: #fdf2ff;
            --card-bg: #fff7fb;
            --text-main: #374151;
            --text-muted: #9ca3af;
            --accent: #ec4899;
            --border: #f9a8d4;
            --row-hover: #fef2ff;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: radial-gradient(circle at top, #f9a8d4 0, #fdf2ff 45%, #e0f2fe 100%);
            color: var(--text-main);
            padding: 26px 16px 32px;
        }

        .container {
            max-width: 1080px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px 20px 18px;
            border: 1px solid var(--border);
            box-shadow:
                    0 18px 36px rgba(236,72,153,0.18),
                    0 0 0 1px rgba(248,187,208,0.6);
        }

        .header-line {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 14px;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
        }

        .subtitle {
            margin: 0;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 0.85rem;
        }

        thead {
            background: #fdf2ff;
        }

        th, td {
            padding: 8px 10px;
            border-bottom: 1px solid #f3e8ff;
            text-align: left;
        }

        th {
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }

        tbody tr:hover {
            background: var(--row-hover);
        }

        .ref {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 0.8rem;
            color: var(--accent);
        }

        .price {
            white-space: nowrap;
        }

        .pill {
            display: inline-flex;
            padding: 2px 8px;
            border-radius: 999px;
            border: 1px solid #fecaca;
            font-size: 0.75rem;
            background: #fee2e2;
            color: #b91c1c;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header-line">
        <h1>Réservations</h1>
        <p class="subtitle">Toutes les agences • Tous les hôtels</p>
    </div>

    <table>
        <thead>
        <tr>
            <th>Agence</th>
            <th>Hôtel</th>
            <th>Ville</th>
            <th>Réf</th>
            <th>Client</th>
            <th>Dates</th>

        </tr>
        </thead>
        <tbody>
        <tr th:each="res : ${reservations}">
            <td><span class="pill" th:text="${res.agencyName}">Agence</span></td>
            <td th:text="${res.hotelName + ' (' + res.hotelId + ')'}"></td>
            <td th:text="${res.city}"></td>
            <td class="ref" th:text="${res.confirmationRef}"></td>
            <td th:text="${res.clientName}"></td>
            <td th:text="${res.startDate + ' → ' + res.endDate}"></td>

        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
