<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Réserver une offre</title>
    <style>
        :root {
            --bg: #fdf2ff;
            --card-bg: #fff7fb;
            --primary: #ec4899;
            --text-main: #4b5563;
            --text-muted: #9ca3af;
            --border: #f9a8d4;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: radial-gradient(circle at top, #fbcfe8 0, #fdf2ff 50%, #e0f2fe 100%);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }

        .container {
            max-width: 560px;
            width: 100%;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px 20px 18px;
            border: 1px solid var(--border);
            box-shadow:
                    0 18px 36px rgba(236,72,153,0.18),
                    0 0 0 1px rgba(248,187,208,0.6);
        }

        h1 {
            margin: 0 0 10px;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        h1 span.icon {
            font-size: 1.4rem;
        }

        .meta {
            margin-bottom: 14px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .meta strong {
            color: var(--text-main);
        }

        .meta-line { margin: 2px 0; }

        label {
            display: block;
            margin: 8px 0 4px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        input {
            width: 100%;
            padding: 7px 9px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: white;
            font-size: 0.9rem;
            color: var(--text-main);
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 1px #fce7f3;
        }

        button {
            margin-top: 14px;
            width: 100%;
            padding: 9px 14px;
            border-radius: 999px;
            border: none;
            background: linear-gradient(135deg, #ec4899, #f97316);
            color: white;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
        }

        button:hover {
            filter: brightness(1.07);
        }
    </style>
</head>
<body>
<div class="container">
    <h1><span class="icon">🧾</span><span>Réserver cette offre</span></h1>

    <div class="meta">
        <p class="meta-line">Offre :</p>
        <p class="meta-line">
            <strong th:text="${offerId}">OFFER-ID</strong>
        </p>
        <p class="meta-line">
            Agence :
            <strong th:text="${agencyId}">AGENCY1</strong>
        </p>
    </div>

    <form action="/reserve" method="post">
        <input type="hidden" name="offerId" th:value="${offerId}">
        <input type="hidden" name="agencyId" th:value="${agencyId}">

        <label>Nom complet</label>
        <input type="text" name="clientName" required>

        <label>Email</label>
        <input type="email" name="clientEmail" required>

        <label>Téléphone</label>
        <input type="text" name="clientPhone" required>

        <button type="submit">Confirmer ✨</button>
    </form>
</div>
</body>
</html>
