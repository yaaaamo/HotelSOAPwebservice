<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Comparison Results</title>
</head>
<body>

<h1>Comparison Results</h1>

<div th:if="${error}">
    <p th:text="${error}" style="color:red;"></p>
</div>

<div th:if="${message}">
    <p th:text="${message}" style="color:orange;"></p>
</div>

<!-- Search form -->
<form action="/search" method="get">
    <label>City: <input type="text" name="city" th:value="${city}"></label><br>
    <label>Start: <input type="date" name="startDate" th:value="${startDate}"></label><br>
    <label>End: <input type="date" name="endDate" th:value="${endDate}"></label><br>
    <label>Persons: <input type="number" name="persons" th:value="${persons}"></label><br>
    <label>Min Price: <input type="number" name="minPrice" th:value="${minPrice}"></label><br>
    <label>Max Price: <input type="number" name="maxPrice" th:value="${maxPrice}"></label><br>
    <label>Stars: <input type="number" name="stars" th:value="${stars}"></label><br>

    <button type="submit">Compare</button>
</form>

<hr>

<div th:if="${hasResults}">
    <h2>Offers from Agencies</h2>

    <div th:each="offer : ${offers}">
        <p>
            <!-- Agency name inferred from the package (.a1. vs .a2.) -->
            Agency:
            <span th:text="${#strings.contains(offer.class.name, '.a1.')
                            ? 'Travel Express (A1)'
                            : 'Voyage Plus (A2)'}"></span><br>

            <!-- Adapt these fields if needed (must exist in AvailabilityOffer) -->
            Offer ID: <span th:text="${offer.offerId}"></span><br>
            Price: <span th:text="${offer.price}"></span>
        </p>

        <!-- Book goes automatically to the right agency -->
        <a th:href="@{/reserve(
                     offerId=${offer.offerId},
                     agency=${#strings.contains(offer.class.name, '.a1.') ? 'A1' : 'A2'}
                     )}">
            Book
        </a>

        <hr>
    </div>
</div>

</body>
</html>
