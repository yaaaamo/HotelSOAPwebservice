<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Confirmation de réservation</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
<div class="container">
    <h1>Confirmation</h1>

    <div th:if="${success}" class="success">
        <p>Votre réservation a été confirmée ✅</p>
        <p>Code de confirmation :
            <strong th:text="${confirmationCode}">CONF-XXXX</strong>
        </p>
        <p>
            Au nom de :
            <strong th:text="${clientName}">Nom</strong>
            (<span th:text="${clientEmail}">email</span>)
        </p>
    </div>

    <div th:if="${error}" class="error">
        <p th:text="${error}">Une erreur s'est produite.</p>
    </div>

    <p><a href="/search">⟵ Retour à la recherche</a></p>
</div>
</body>
</html>
