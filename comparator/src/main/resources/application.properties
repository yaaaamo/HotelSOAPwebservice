spring.application.name=comparator
# Comparator Configuration
server.port=8080


# Agency 1
agencies.partners[0].id=A1
agencies.partners[0].name=Premium Travel Agency
agencies.partners[0].wsdl-url=http://localhost:9091/agencyservice?wsdl
agencies.partners[0].service-interface=com.example.HotelSOAP.comparator.clients.a1.AgencyService
agencies.partners[0].namespace=http://service.agency.HotelTP.example.com/
agencies.partners[0].service-name=AgencyServiceImplService
agencies.partners[0].port-name=AgencyServiceImplPort
agencies.partners[0].enabled=true

# Agency 2
agencies.partners[1].id=A2
agencies.partners[1].name=Budget Tours
agencies.partners[1].wsdl-url=http://localhost:9093/agencyservice?wsdl
agencies.partners[1].service-interface=com.example.HotelSOAP.comparator.clients.a2.AgencyService
agencies.partners[1].namespace=http://service.agency.HotelTP.example.com/
agencies.partners[1].service-name=AgencyServiceImplService
agencies.partners[1].port-name=AgencyServiceImplPort
agencies.partners[1].enabled=true

# Agency 3 - Example: easily add a third agency!
# First generate stubs: wsimport -keep -p com.example.HotelSOAP.comparator.clients.a3 http://localhost:9095/agencyservice?wsdl
